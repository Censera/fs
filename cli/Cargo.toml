[package]
name = "fsize-cli"
version = "1.0.0"
edition = "2024"
authors = ["Censera <Me@Censera.space>"]
description = "A tool for measuring file and directory size"
license = "MIT"
repository = "https://github.com/Censera/fsize"
readme = "../README.md"

[[bin]]
name = "fsize"
path = "src/main.rs"

[dependencies]
fsize-core = { path = "../core", version = "1.0.0" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
