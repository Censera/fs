name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            archive: tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            archive: tar.gz

          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            use_cross: true
            archive: tar.gz

          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            archive: tar.gz

          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            archive: tar.gz

          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            archive: tar.gz

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            archive: zip

          - target: x86_64-pc-windows-gnu
            os: windows-latest
            use_cross: false
            archive: zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary (Native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --locked --release --target ${{ matrix.target }} --package fscli

      - name: Build Binary (Cross)
        if: matrix.use_cross
        run: cross build --locked --release --target ${{ matrix.target }} --package fscli

      - name: Package Archive (POSIX)
        if: matrix.archive == 'tar.gz'
        run: |
          staging="fs-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/fs" "$staging/"
          cp README.md "$staging/" 2>/dev/null || true
          cp LICENSE "$staging/" 2>/dev/null || true
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> $GITHUB_ENV

      - name: Package Archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "fs-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/fs.exe" -Destination $staging
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination $staging }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination $staging }
          Compress-Archive -Path $staging/* -DestinationPath "$staging.zip"
          echo "ASSET=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
