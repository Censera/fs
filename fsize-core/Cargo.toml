[package]
name = "fsize-core"
version = "0.2.0"
edition = "2024"
description = "Core size-computation, formatting, and disk-usage logic for the fsize CLI"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
thiserror = "2.0"
jwalk = "0.8"
rayon = "1.10"
glob = "0.3"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_Console"
] }

